name: alert-remediation

on:
  repository_dispatch:
    types: [infra_alert]

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Execute remediation prompt
        env:
          ALERT_PROMPT: ${{ github.event.client_payload.prompt }}
        run: |
          if [ -z "$ALERT_PROMPT" ]; then
            echo "Missing client_payload.prompt"
            exit 1
          fi
          python scripts/agent_loop.py --prompt "$ALERT_PROMPT"
